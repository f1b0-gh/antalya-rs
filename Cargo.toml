[package]
name = "antalya-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Community client for Antalya database"
repository = "https://github.com/f1b0-gh/antalya-rs"
documentation = "https://docs.rs/antalya-rs"
keywords = ["clickhouse", "antalya", "arrow", "iceberg"]
categories = ["database", "api-bindings"]
exclude = [".local/**", "**/__pycache__/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["arrow"]
arrow = ["dep:clickhouse", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc", "dep:tokio", "dep:serde_json", "dep:tempfile", "dep:uuid", "dep:hyper-util", "dep:hyper", "dep:tower-service", "dep:flatbuffers", "dep:arrow-buffer", "dep:base64", "dep:serde"]
tls = ["reqwest/rustls", "dep:hyper-rustls", "dep:rustls", "clickhouse?/rustls-tls-aws-lc", "clickhouse?/rustls-tls-native-roots"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false }
# Qualified together with Arrow below; upgrade as a set (see docs/testing.md).
clickhouse = { version = "=0.15.3", default-features = false, optional = true }

arrow-buffer = { version = "=59.3.3", optional = true }
arrow-array = { version = "=59.3.3", optional = true }
arrow-schema = { version = "=59.3.3", optional = true }
# Compatible with arrow-ipc's FlatBuffers 25 requirement; verifier types are shared.
flatbuffers = { version = "25.12.19", optional = true, default-features = false, features = ["std"] }
arrow-ipc = { version = "=59.3.3", features = ["lz4", "zstd"], optional = true }
tokio = { version = "1.54.1", features = ["time", "sync", "rt"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.23.1", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std"], optional = true }
tempfile = { version = "3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
hyper = { version = "1.12.0", features = ["client", "http1"], optional = true }
tower-service = { version = "0.3.3", optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "aws-lc-rs", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }

[dev-dependencies]
arrow-schema = "=59.3.3"

tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[workspace]

[[example]]
name = "arrow"
required-features = ["arrow"]

[[example]]
name = "ipc"
required-features = ["arrow"]

[[example]]
name = "client_profile"
required-features = ["arrow"]
